name: Sincronización Automática de Tarifas SUNASS (Power Automate / OneDrive)

on:
  # Evento disparado desde Power Automate cuando se modifica TARIFA.xlsx en OneDrive
  repository_dispatch:
    types: [sharepoint_sync, sync_tarifas]

  # Permite también ejecutar manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

  # Disparar si alguien sube directamente TARIFA.xlsx al repositorio
  push:
    paths:
      - 'TARIFA.xlsx'
    branches:
      - main

permissions:
  contents: write

jobs:
  update-tarifas:
    runs-on: ubuntu-latest
    name: Procesar TARIFA.xlsx y Actualizar Catálogo

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Guardar archivo Excel desde Power Automate (si viene en el payload)
        if: ${{ github.event.client_payload.file_content != '' }}
        env:
          FILE_CONTENT: ${{ github.event.client_payload.file_content }}
        run: |
          python -c "
          import os, base64, json
          content = os.environ.get('FILE_CONTENT', '').strip()
          if content:
              if content.startswith('{') and '\$content' in content:
                  try:
                      data = json.loads(content)
                      content = data.get('\$content', content)
                  except Exception:
                      pass
              content = content.strip().strip('\"').strip('\'')
              with open('TARIFA.xlsx', 'wb') as f:
                  f.write(base64.b64decode(content))
              print('✅ Archivo TARIFA.xlsx recibido y guardado con éxito desde Power Automate.')
          "

      - name: Convertir Excel a tarifas_data.js y tarifas_catalog.json
        run: |
          python convert_tarifas.py TARIFA.xlsx

      - name: Guardar y Publicar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add TARIFA.xlsx tarifas_data.js tarifas_catalog.json
          
          # Verificar si hay cambios
          if git diff --staged --quiet; then
            echo "No se detectaron cambios en las tarifas."
          else
            git commit -m "chore(tarifas): actualización automática del pliego tarifario SUNASS desde OneDrive"
            git push origin main
            echo "Tarifas actualizadas y publicadas con éxito."
          fi
